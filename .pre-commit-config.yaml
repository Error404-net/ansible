---
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
  - repo: https://github.com/ansible/ansible-lint
    rev: v24.12.2
    hooks:
      - id: ansible-lint
  - repo: local
    hooks:
      - id: sops-encrypted
        name: "*.sops.yml must be encrypted"
        entry: >-
          bash -c 'for f in "$@"; do grep -q "^sops" "$f" || { echo "NOT ENCRYPTED $f"; exit 1; }; done' --
        language: system
        files: \.sops\.ya?ml$
