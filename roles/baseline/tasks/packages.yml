---
- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages if baseline_node_exporter else (baseline_packages | difference(['prometheus-node-exporter'])) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
  when: baseline_unattended_upgrades | bool

- name: Node exporter running
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true
  when: baseline_node_exporter | bool
