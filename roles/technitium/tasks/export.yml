---
- name: Export dir
  ansible.builtin.file:
    path: "{{ technitium_export_dir }}"
    state: directory
    mode: "0750"

- name: Write zone export (review, then move to dns/<zone>.yml)
  ansible.builtin.template:
    src: dns-export.yml.j2
    dest: "{{ technitium_export_dir }}/{{ item.key }}.yml"
    mode: "0640"
  loop: "{{ technitium_live_records | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
