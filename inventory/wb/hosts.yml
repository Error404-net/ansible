---
# wb.error404.net : HOME PRODUCTION
# Grouping: zone -> location -> purpose. Mirror the naming already used in
# Technitium; do not invent a new convention. Real hosts are added by the
# agent's discovery pass ONLY after this repo is private (see prompt.md).
#
# Example shape (delete once real hosts exist):
#   wb:
#     children:
#       wb_<location>:
#         children:
#           wb_<location>_<purpose>:
#             hosts:
#               <host>.wb.error404.net:
#                 location: <location>
#                 purpose: <purpose>
wb:
  vars:
    dns_zone: wb.error404.net
    env_tier: production
  children:
    wb_ctrl:
      hosts: {}
