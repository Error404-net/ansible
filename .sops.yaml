---
# SOPS + age. Every *.sops.yml is encrypted to ALL recipients below.
# Replace the placeholders with real age PUBLIC keys (age1...), then run
#   sops updatekeys <file>   on any existing encrypted file.
#   - jesse     : personal age key (YubiKey via age-plugin-yubikey, or a file key)
#   - ctrl      : the control node's key, generated by the control_node role
creation_rules:
  - path_regex: .*\.sops\.ya?ml$
    encrypted_regex: ^(.*token.*|.*password.*|.*secret.*|.*key.*|.*api.*)$
    age: >-
      CHANGEME_age1_jesse_public_key,
      CHANGEME_age1_ctrl_public_key
